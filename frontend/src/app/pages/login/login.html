<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">🎬</div>
      <h2>Bem-vindo(a)!</h2>
      <p>Faça login para continuar no CineMatch</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="form-group">
        <label for="email">E-mail</label>
        <div class="input-wrapper">
          <input 
            id="email" 
            type="email" 
            formControlName="email" 
            placeholder="seu@email.com"
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <input 
            id="password" 
            type="password" 
            formControlName="password" 
            placeholder="••••••••"
          />
        </div>
      </div>

      @if (loginError()) {
        <div class="error-message">
          ⚠️ {{ loginError() }}
        </div>
      }

      <button type="submit" class="btn-submit" [disabled]="loginForm.invalid || isSubmitting() || isGuestSubmitting()">
        <span>{{ isSubmitting() ? '⏳ Entrando...' : 'Entrar' }}</span>
      </button>

      <div style="margin-top: 10px; text-align: center; color: #6a677a; font-size: 14px;">ou</div>

      <button type="button" class="btn-submit" style="background-color: #4f46e5; margin-top: 10px;" (click)="loginAsGuest()" [disabled]="isSubmitting() || isGuestSubmitting()">
        <span>{{ isGuestSubmitting() ? '⏳ Entrando como Visitante...' : '🚀 Entrar como Visitante' }}</span>
      </button>

      <div class="auth-footer">
        <p>Ainda não tem uma conta? <a routerLink="/register">Registre-se aqui</a></p>
      </div>
    </form>
  </div>
</div>
